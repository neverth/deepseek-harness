<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: browsers that support it resize the layout viewport
         for the soft keyboard, so bottom-anchored chrome needs no JS. No WebKit
         release implements it (iOS Safari 26 and 27 included), which is why
         AppFrame also sizes the mobile frame from the visual viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DSH Local Build</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
